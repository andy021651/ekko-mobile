<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ekko">
<meta name="theme-color" content="#0C0F14">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>Ekko</title>
<style>
  /* 和電腦版 Ekko（ui/styles.css）同一套：深色底、Avenir Next、淡藍強調色、膠囊按鈕。 */
  :root {
    color-scheme: dark;
    --ink: #0C0F14;
    --paper: #ECEEF2;
    --accent: #93A6C0;
    --text: rgba(236, 238, 242, 0.96);
    --muted: rgba(236, 238, 242, 0.64);
    --surface: rgba(236, 238, 242, 0.045);
    --surface-raised: rgba(236, 238, 242, 0.08);
    --line: rgba(236, 238, 242, 0.08);
    --danger: #D9A39B;
    --ok: #8FC79A;
    --info: #8FB4E0;
    --warn: #E3C77A;
    --font-ui: "Avenir Next", "SF Pro Text", -apple-system, BlinkMacSystemFont, "PingFang TC", sans-serif;
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
    --radius-card: 16px;
    --radius-pill: 999px;
  }
  * { box-sizing: border-box; margin: 0; }
  [hidden] { display: none !important; }
  html { background: var(--ink); }
  body { min-height: 100vh; background: var(--ink); color: var(--text); font-family: var(--font-ui); font-size: 15px; line-height: 1.5;
         -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
         padding: env(safe-area-inset-top) 16px calc(32px + env(safe-area-inset-bottom)); }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
  button:focus-visible, input:focus-visible { outline: 1.5px solid var(--accent); outline-offset: 3px; }

  /* Logo：和電腦版同一組線條，echo 那一筆用強調色。 */
  .logo { display: block; height: 20px; }
  .logo path, .logo circle { fill: none; stroke: var(--paper); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
  .logo .echo { stroke: var(--accent); }
  .logo-large { height: 56px; }

  /* 頂列 */
  header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 8px; height: 56px; margin: 0 -16px; padding: 0 16px;
           background: rgba(12, 15, 20, 0.86); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
  header h1 { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 17px; font-weight: 600; letter-spacing: -0.2px; }
  .icon-button { display: grid; place-items: center; width: 44px; height: 44px; margin: 0 -10px; border-radius: 50%; color: var(--muted); }
  .icon-button svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .icon-button:active { background: var(--surface); }

  /* 按鈕 */
  .primary-button { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 28px; border-radius: var(--radius-pill);
                    background: var(--paper); color: var(--ink); font-size: 15px; font-weight: 600; transition: transform 240ms var(--ease); }
  .primary-button:active { transform: scale(0.98); }
  .quiet-button { min-height: 36px; padding: 0 16px; border-radius: var(--radius-pill); color: var(--muted); font-size: 14px; }
  .quiet-button:active { background: var(--surface); }
  .pill { min-height: 32px; padding: 0 14px; border-radius: var(--radius-pill); background: var(--surface-raised); color: var(--text); font-size: 13px; font-weight: 500; }
  .pill.on { background: var(--paper); color: var(--ink); }

  /* 置中的單一畫面：登入、加入主畫面、連結電腦、沒有權限 */
  .hero { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; min-height: calc(100vh - 140px); text-align: center; }
  .hero h2 { margin-top: 16px; font-size: 24px; font-weight: 600; letter-spacing: -0.5px; }
  .hero p { max-width: 300px; color: var(--muted); }
  .hero .primary-button { width: min(100%, 320px); margin-top: 16px; }
  .hero .note { font-size: 12px; }
  .steps { display: grid; gap: 12px; width: min(100%, 320px); margin-top: 8px; text-align: left; }
  .step { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--radius-card); background: var(--surface); color: var(--text); font-size: 14px; }
  .step b { display: grid; place-items: center; flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--surface-raised); font-size: 12px; font-weight: 600; }
  .step svg { flex: none; width: 20px; height: 20px; margin-left: auto; fill: none; stroke: var(--accent); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .code-input { width: min(100%, 320px); min-height: 48px; padding: 0 16px; border: 0; border-radius: var(--radius-card); background: var(--surface-raised);
                color: var(--text); font: inherit; font-size: 14px; }
  .code-input::placeholder { color: var(--muted); }
  .account { display: inline-flex; align-items: center; gap: 8px; padding: 6px 6px 6px 16px; border-radius: var(--radius-pill); background: var(--surface); font-size: 14px; }

  /* 提示列（電腦版 .notice） */
  .notice { display: flex; align-items: center; gap: 8px; min-height: 40px; margin: 4px 0 12px; padding: 8px 16px; border-radius: var(--radius-card);
            background: var(--surface); color: var(--muted); font-size: 13px; }
  .notice .dot { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--warn); }

  /* 任務列（電腦版 .job-row）：剪輯中左邊一條強調色 */
  /* 欄寬固定是螢幕寬（minmax(0, 1fr)）：不換行的長片名才不會把整個清單撐寬、可以左右拖。 */
  .jobs { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .job { display: flex; align-items: center; gap: 14px; width: 100%; padding: 10px 8px 10px 10px; border-radius: var(--radius-card); text-align: left; }
  .job:active { background: var(--surface); }
  .job.live { box-shadow: inset 2px 0 0 var(--accent); }
  .thumb { flex: none; width: 48px; height: 85px; border-radius: 10px; overflow: hidden; background: var(--surface-raised); }
  .thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .job-text { flex: 1; min-width: 0; }
  .job-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; font-weight: 600; letter-spacing: -0.1px; }
  .job-status { display: flex; align-items: center; gap: 6px; margin-top: 2px; color: var(--muted); font-size: 12px; }
  .job-status .dot { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
  .job-status.done .dot { background: var(--ok); }
  .job-status.running .dot { background: var(--info); }
  .job-status.queued .dot { background: var(--warn); }
  .job-status.failed .dot { background: var(--danger); }
  .job-status.running { color: var(--text); }
  .job .pill { flex: none; }
  .empty { padding: 48px 16px; color: var(--muted); text-align: center; }

  /* 看片頁 */
  .player { display: block; width: 100%; max-height: 70vh; margin-top: 4px; border-radius: var(--radius-card); background: #000; }
  .meta { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 14px 2px; }
  .versions { display: flex; gap: 8px; flex-wrap: wrap; }
  .follow { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 8px; padding: 12px 12px 12px 16px;
            border-radius: var(--radius-card); background: var(--surface); }
  .muted { color: var(--muted); }

  /* 版本清單與修改框 */
  .versions-list { margin-top: 0; }
  .version { display: flex; align-items: baseline; gap: 10px; width: 100%; min-height: 44px; padding: 12px 16px; text-align: left; font-size: 14px; }
  .version + .version { border-top: 1px solid var(--line); }
  .version b { flex: none; font-weight: 600; color: var(--muted); }
  .version.on b { color: var(--accent); }
  .version.on .version-text { color: var(--text); }
  .version-text { flex: 1; min-width: 0; color: var(--muted); }
  .version-wait { flex: none; color: var(--muted); font-size: 12px; }
  .version.pending { align-items: center; }
  .version.pending .dot { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--warn); }
  .revise { margin-top: 12px; padding: 12px; border-radius: var(--radius-card); background: var(--surface); }
  .revise-input { display: block; width: 100%; min-height: 72px; padding: 10px 12px; border: 0; border-radius: 12px; background: var(--surface-raised);
                  color: var(--text); font: inherit; font-size: 15px; resize: vertical; }
  .revise-input::placeholder { color: var(--muted); }
  .revise-actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 10px; }
  .primary-button.small { min-height: 40px; padding: 0 20px; font-size: 14px; }
  .primary-button:disabled { opacity: 0.5; }
  .revise-status { margin-top: 10px; color: var(--muted); font-size: 13px; }
  .revise-status.alert { color: var(--danger); }
  /* 修改頁：這裡要改、卡片、修改單 */
  /* 自己的播放器 */
  /* 影片固定在標題列下面：最高半個畫面，往下捲清單時縮小（body.video-mini），邊看邊點句子。 */
  .stage { position: sticky; top: 56px; z-index: 4; margin-top: 4px; border-radius: var(--radius-card); overflow: hidden; background: #000; }
  .stage .player { margin-top: 0; border-radius: 0; max-height: 50vh; object-fit: contain; transition: max-height 200ms var(--ease); }
  .video-mini .stage .player { max-height: 30vh; }
  .video-mini .stage-mark { bottom: 50px; min-height: 36px; padding: 0 12px; font-size: 13px; }
  /* 影片本身已經有字幕：逐句字幕只在修改卡片打開時顯示（正在改的那句）。 */
  .stage-caption { display: none; }
  .marking .stage-caption:not(:empty) { display: block; }
  .stage-caption { position: absolute; top: 10px; left: 10px; right: 10px; padding: 4px 10px; border-radius: var(--radius-pill); width: fit-content; max-width: calc(100% - 20px);
                   overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: rgba(0, 0, 0, 0.5); color: #fff; font-size: 13px; pointer-events: none; }
  .stage-caption:empty { display: none; }
  .stage-mark { position: absolute; right: 12px; bottom: 64px; min-height: 44px; padding: 0 18px; border-radius: var(--radius-pill);
                background: var(--paper); color: var(--ink); font-size: 15px; font-weight: 600; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35); }
  .stage-controls { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 6px; padding: 4px 8px;
                    background: linear-gradient(transparent, rgba(0, 0, 0, 0.65)); }
  .stage-button { display: grid; place-items: center; flex: none; width: 44px; height: 44px; color: #fff; font-size: 17px; }
  .stage-time { flex: none; color: #fff; font-size: 12px; font-variant-numeric: tabular-nums; }
  .stage-scrub { position: relative; flex: 1; height: 44px; touch-action: none; cursor: pointer; }
  .stage-scrub::before { content: ""; position: absolute; left: 0; right: 0; top: 20px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.3); }
  .stage-fill { position: absolute; left: 0; top: 20px; height: 4px; border-radius: 2px; background: var(--paper); pointer-events: none; }
  .stage-marks { position: absolute; inset: 0; pointer-events: none; }
  .stage-dot { position: absolute; top: 10px; width: 24px; height: 24px; margin-left: -12px; pointer-events: auto; }
  .stage-dot::after { content: ""; position: absolute; left: 7px; top: 7px; width: 10px; height: 10px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.5); }
  .stage-full { position: fixed; top: 0; inset: 0; z-index: 8; margin: 0; border-radius: 0; display: flex; align-items: center; }
  .stage-full .player { width: 100%; height: 100%; max-height: none !important; object-fit: contain; }
  .stage-full .stage-controls { padding-bottom: calc(4px + env(safe-area-inset-bottom)); }
  .stage-full .stage-mark { bottom: calc(64px + env(safe-area-inset-bottom)); }
  .stage-full .stage-caption { top: calc(10px + env(safe-area-inset-top)); }
  body.stage-open { overflow: hidden; }
  .stage-band { position: absolute; top: 15px; height: 14px; border-radius: 4px; background: rgba(147, 166, 192, 0.55); pointer-events: none; }
  .stage-band[hidden] { display: none; }
  .stage-dot.pending::after { background: transparent; border: 2px solid var(--warn); left: 6px; top: 6px; width: 12px; height: 12px; box-sizing: border-box; }
  .stage-full .stage-controls { transition: bottom 200ms var(--ease); }
  .line-card, .bottom-panel { touch-action: none; transition: transform 200ms var(--ease); }
  .line-card.dragging { transition: none; }
  .line-card textarea, .bottom-panel textarea { touch-action: auto; }
  .line-card, .bottom-panel { max-height: calc(100dvh - 24px); overflow-y: auto; overscroll-behavior: contain; }
  .line-card.tall { touch-action: pan-y; }
  .card-handle { justify-self: center; width: 36px; height: 4px; margin-bottom: 2px; border-radius: 2px; background: rgba(236, 238, 242, 0.25); }
  .line-card.over-video { background: rgba(21, 24, 30, 0.84); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  .line-card, .bottom-panel { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; padding: 8px 16px calc(12px + env(safe-area-inset-bottom));
               border-radius: 20px 20px 0 0; background: #15181E; box-shadow: 0 -12px 32px rgba(0, 0, 0, 0.4); display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
  /* 卡片開著：影片縮小，整個畫面留在卡片上方看得到 */
  .marking .player { object-fit: contain; }
  .card-divider { width: 1px; height: 20px; margin: 0 2px; background: var(--line); }
  .card-add-note { justify-self: start; min-height: 36px; padding: 0 4px; }
  .card-nav { display: flex; align-items: center; justify-content: space-between; }
  .card-nav .quiet-button { min-height: 44px; }
  .card-nav .quiet-button:disabled { opacity: 0.3; }
  .card-quote { font-size: 16px; line-height: 1.45; }
  .card-choices { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .line-card .pill { min-height: 44px; padding: 0 12px; font-size: 14px; }
  .card-note { min-height: 56px; }
  .card-extra[hidden] { display: none; }
  /* 卡片上不要出現 iPhone 的長按選字（會框到整張卡片）；選範圍改成點字。說明欄照常可以選。 */
  .line-card { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .line-card textarea { -webkit-user-select: text; user-select: text; }
  .card-quote .word { border-radius: 4px; cursor: pointer; }
  .card-quote .word.picked { background: var(--accent); color: var(--ink); }
  .card-part { display: flex; align-items: center; gap: 8px; }
  .card-part:empty { display: none; }
  .card-part .quiet-button { min-height: 32px; padding: 0 6px; }
  .card-explain { font-size: 13px; line-height: 1.45; }
  .card-play { font-variant-numeric: tabular-nums; color: var(--text); }
  .trim-panel { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; padding: 4px 0; }
  .trim-row { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .trim-label { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .trim-wave { width: 100%; height: 56px; border-radius: 8px; background: var(--surface-raised); touch-action: pan-y; }
  .trim-buttons { display: flex; gap: 6px; }
  .trim-buttons .pill { min-height: 44px; min-width: 52px; }
  .trim-panel .quiet-button { justify-self: start; padding: 0 4px; }
  .sentences-head { display: flex; align-items: center; justify-content: space-between; min-height: 48px; padding: 0 8px 0 16px; }
  .sentences-toggle { min-height: 44px; font-size: 14px; font-weight: 500; text-align: left; }
  .sentence { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 10px 16px; border-top: 1px solid var(--line); text-align: left; font-size: 14px; }
  .sentence-time { flex: none; width: 34px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .sentence-text { flex: 1; min-width: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .sentence-tags { flex: none; display: flex; align-items: center; gap: 6px; }
  .sentence .tag { padding: 2px 8px; border-radius: var(--radius-pill); background: var(--surface-raised); color: var(--muted); font-size: 11px; }
  .sentence .tag.on { background: var(--paper); color: var(--ink); }
  .changed-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  .sentence.ordering { padding-right: 8px; }
  .sentence.ordering .move { margin: 0; }
  .sentence.ordering .move:disabled { opacity: 0.25; }
  .sentence.cut .sentence-text { color: var(--muted); text-decoration: line-through; }
  .sentences .revise-actions { padding: 8px 16px 12px; border-top: 1px solid var(--line); }
  .pad-x { padding: 4px 16px 8px; }
  .job-summary { margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 12px; }
  .row.action .value { color: var(--accent); }
  /* 最下方那一條和清單之間留空，捲到底時最後一句不被擋住。 */
  #view > .group.sentences { margin-bottom: 16px; }
  .meta .job-actions { flex-wrap: wrap; justify-content: flex-end; }
  .version-chip { font-variant-numeric: tabular-nums; }
  .sentences-hint { margin-left: auto; padding-right: 8px; }
  .sentences-head .quiet-button { flex: none; }
  /* 沒有修改單時的樣子：實心底（不能半透明，固定在下方時底下的句子會透上來），細邊與陰影和內容分開。 */
  .sheet-bar.quiet { background: #22262E; color: var(--text); border: 1px solid rgba(236, 238, 242, 0.12); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5); }
  .card-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 14px; }
  .card-tools .card-add-note { justify-self: auto; }
  .card-tools .attach-field { display: contents; }
  .card-tools .attach-chips { flex-basis: 100%; }
  .version-panel .versions-list, .send-panel .sheet-list { margin: 0; }
  .attach-field { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .attach-add { justify-self: start; min-height: 36px; padding: 0 4px; }
  .attach-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .attach-chip { display: flex; align-items: center; gap: 6px; max-width: 100%; padding: 4px 4px 4px 10px; border-radius: var(--radius-pill); background: var(--surface-raised); font-size: 12px; }
  .attach-name { max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .attach-drop { width: 32px; height: 32px; border-radius: 50%; color: var(--muted); }
  .sentences-tabs { display: flex; gap: 6px; padding: 0 16px 10px; }
  .sentences-tabs .pill { min-height: 36px; }
  .sentence-time.wide { width: auto; min-width: 74px; }
  .mix-row { display: grid; grid-template-columns: 40px 1fr 56px; align-items: center; gap: 10px; min-height: 44px; }
  .mix-name { font-size: 14px; }
  .mix-value { color: var(--muted); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
  .mix-slider { width: 100%; accent-color: var(--paper); }
  .panel-item.link { display: grid; place-items: center; color: var(--text); text-decoration: none; }
  .job-actions { display: flex; gap: 6px; }
  .job-actions .pill { min-height: 36px; }
  .pill.warn { color: var(--warn); }
  .version.pending .icon-button, .version.pending .quiet-button { flex: none; margin: -8px -8px -8px auto; }
  .version.returned .dot { background: var(--danger); }
  .version.pending .quiet-button { white-space: nowrap; }
  .queue-note { margin: -6px 2px 12px; }
  .report { margin: 0 2px 12px; }
  .report-text { margin-top: 4px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
  .report .quiet-button { padding: 0; min-height: 36px; }
  .panel-shade { position: fixed; inset: 0; z-index: 8; background: rgba(0, 0, 0, 0.4); }
  .bottom-panel { gap: 6px; }
  .panel-item { width: 100%; min-height: 48px; border-radius: 12px; background: var(--surface-raised); font-size: 15px; }
  .panel-item.danger { color: var(--danger); }
  .panel-item.muted { background: transparent; }
  .card-label { flex: none; width: 32px; color: var(--muted); font-size: 12px; }
  .sheet-list { margin-bottom: 10px; }
  .sheet-list[hidden], .sheet-bar[hidden], .card-note[hidden], .card-add-note[hidden] { display: none; }
  .sheet-row { display: flex; align-items: center; gap: 4px; border-top: 1px solid var(--line); }
  .sheet-text { flex: 1; min-width: 0; min-height: 44px; padding: 10px 0; text-align: left; font-size: 14px; }
  .sheet-bar { position: sticky; bottom: calc(8px + env(safe-area-inset-bottom)); display: flex; justify-content: space-between; align-items: center; width: 100%; min-height: 48px;
               margin-top: 12px; padding: 0 20px; border-radius: var(--radius-pill); background: var(--paper); color: var(--ink); font-size: 15px; font-weight: 600; }
  .small { font-size: 12px; }
  .pad { padding: 24px 2px; }
  /* 設定：一列一項，左標題右內容 */
